/* === Website-er accent colour ekhane bodlaw === */
--accent:#1d6ff2;--accent-dark:#0a3a9e;--glow:29,111,242;--glow-a:.14;--glow-b:.32;
--bg1:#ffffff;--bg2:#e8f0fc;--btn:#fff;--btn-ink:#0a3a9e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#6fb0ff;--accent-dark:#2f6fe0;--glow:90,160,255;--glow-a:.22;--glow-b:.5;--bg1:#16295a;--bg2:#070e24;--btn:#1a2d5e;--btn-ink:#cfe1ff}}
:root[data-theme="dark"]{--accent:#6fb0ff;--accent-dark:#2f6fe0;--glow:90,160,255;--glow-a:.22;--glow-b:.5;--bg1:#16295a;--bg2:#070e24;--btn:#1a2d5e;--btn-ink:#cfe1ff}
html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 40%,var(--bg1),var(--bg2) 75%);overflow:hidden;font-family:"Outfit","Segoe UI",Helvetica,Arial,sans-serif;transition:background .5s}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2vh,14px)}
.mark{position:relative;width:min(77.6vw,52.4vh,620px);aspect-ratio:1;perspective:1500px;--mx:0;--my:0}
.float{position:absolute;inset:0;transform-style:preserve-3d;translate:-.1% .7%}
.play .float{animation:glow 5s ease-in-out 2.2s infinite,float 7s ease-in-out 2.2s infinite}
.p{position:absolute;opacity:0;background:var(--k) center/100% 100% no-repeat;translate:calc(var(--mx)*var(--d)*1px) calc(var(--my)*var(--d)*1px);transition:translate .3s ease-out;will-change:transform}
.play .p{animation:open .9s cubic-bezier(.22,1,.36,1) var(--delay) forwards,land .7s ease-out calc(var(--delay) + .6s) forwards}
.ring{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;margin:-31% 0 0 -31%;border-radius:50%;border:2px solid rgba(var(--glow),.5);opacity:0;pointer-events:none}
.play .ring{animation:ring 1.2s cubic-bezier(.2,.7,.2,1) 1.9s forwards}
.sp{position:absolute;width:var(--s);aspect-ratio:1;background:var(--accent);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;filter:drop-shadow(0 0 5px rgba(var(--glow),.9));pointer-events:none}
.play .sp{animation:tw 3s ease-in-out var(--t) infinite}
.name{display:flex;gap:.2em;font-weight:500;font-size:clamp(30px,10vw,72px);letter-spacing:.2em;margin-right:-.2em;line-height:1.1;perspective:700px;filter:drop-shadow(0 8px 20px rgba(var(--glow),.34))}
.play .name{animation:track 1.2s cubic-bezier(.22,1,.36,1) 1.6s backwards}
.name span{display:block;opacity:0;transform-origin:50% 100%;transform:translateY(.7em) rotateX(-85deg) scale(.9);filter:blur(10px);background:linear-gradient(110deg,var(--accent-dark) 30%,#3cc9ff 50%,var(--accent-dark) 70%) 100% 0/320% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.play .name span{animation:letter .8s cubic-bezier(.22,1,.36,1) calc(1.7s + var(--i)*.05s) forwards,shim 5s ease-in-out calc(3.2s + var(--i)*.1s) infinite}
.btns{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.btns button{border:0;background:var(--btn);color:var(--btn-ink);font:500 14px "Outfit",sans-serif;padding:10px 16px;border-radius:999px;box-shadow:0 2px 12px rgba(var(--glow),.25)}
@keyframes open{
 0%{opacity:0;filter:blur(16px);transform:translate3d(var(--tx),var(--ty),0) rotate3d(var(--rx),var(--ry),0,var(--ang)) scale(.75)}
 55%{opacity:1;filter:blur(1px)}
